</script>
<style>
:root{
  --navy:#14284b; --navy2:#1f3a68; --navy3:#2c4f8a; --gold:#a8852f; --gold-soft:#f3ead3;
  --paper:#f7f5ef; --card:#ffffff; --line:#dcd7ca; --line2:#ebe7dc;
  --ink:#1c1f26; --muted:#5b6170; --faint:#8a8f9b;
  --red:#b3261e; --red-soft:#fbe9e7; --amber:#a86400; --amber-soft:#fdf1dc;
  --green:#2b6a3d; --green-soft:#e6f2e8; --blue-soft:#e8eef8;
  --room:#0e1525; --room2:#172238; --room3:#22304d;
  --serif:"Noto Serif KR",serif; --sans:"Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--navy3)}
.hidden{display:none!important}

/* ── 상단 관인 바 ── */
.gov{background:var(--navy);color:#fff;border-bottom:3px solid var(--gold)}
.gov-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.seal{width:38px;height:38px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;font-family:var(--serif);font-weight:900;color:var(--gold);font-size:13px;letter-spacing:-1px;flex:none}
.gov-t{display:flex;flex-direction:column;line-height:1.25}
.gov-t small{color:#c9d2e4;font-size:12px;letter-spacing:.5px}
.gov-t b{font-family:var(--serif);font-size:18px;font-weight:700;letter-spacing:-.3px}
.navbtns{margin-left:auto;display:flex;gap:6px}
.navbtns button{background:transparent;border:1px solid #4a628f;color:#fff;border-radius:4px;padding:5px 11px;font-size:13px}
.navbtns button:hover:not(:disabled){background:var(--navy2)}
.navbtns button:disabled{opacity:.35;cursor:default}
.tabs{background:#fff;border-bottom:1px solid var(--line)}
.tabs-in{max-width:1180px;margin:0 auto;padding:0 12px;display:flex;overflow-x:auto}
.tabs button{border:0;background:none;padding:13px 16px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--navy);border-bottom-color:var(--navy);font-weight:700}
main{max-width:1180px;margin:0 auto;padding:26px 20px 80px}

/* ── 공통 ── */
h1,h2,h3{font-family:var(--serif);letter-spacing:-.4px;margin:0}
h1{font-size:26px} h2{font-size:20px} h3{font-size:16px}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.head .grow{flex:1;min-width:220px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px 20px}
.card+.card{margin-top:14px}
.grid>.card+.card,.notes>.card+.card{margin-top:0}
.card h3{margin-bottom:10px;display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:860px){.g2,.g3,.g4{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:#fff;border-radius:4px;padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--navy3)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.lg{padding:12px 22px;font-size:16px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:3px;border:1px solid;font-weight:500;white-space:nowrap}
.t-인성{color:#6b4e00;border-color:#d9c48a;background:#fbf5e3}
.t-구상형{color:var(--navy2);border-color:#a9bbdb;background:var(--blue-soft)}
.t-즉답형{color:#6c2c62;border-color:#d4aed0;background:#f7ecf5}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:500}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{width:100%;border:1px solid var(--line);border-radius:4px;padding:8px 10px;background:#fff}
textarea{resize:vertical;min-height:80px;line-height:1.6}
input:focus,select:focus,textarea:focus{outline:2px solid #9fb3d9;outline-offset:0;border-color:var(--navy3)}
.note{font-size:13px;color:var(--muted);background:var(--paper);border-left:3px solid var(--gold);padding:8px 12px;border-radius:0 4px 4px 0}
.note.warn{border-left-color:var(--amber);background:var(--amber-soft);color:#5d3a00}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line2);padding:8px 8px;text-align:left;vertical-align:top}
th{font-weight:700;color:var(--muted);font-size:13px;background:#faf9f5;border-bottom:1px solid var(--line)}
td input,td textarea,td select{padding:5px 7px;font-size:14px}
td textarea{min-height:38px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.stat{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--navy);line-height:1.1}
.stat small{font-size:14px;color:var(--muted);font-family:var(--sans);font-weight:400}
.kicker{font-size:12px;color:var(--muted);letter-spacing:.4px;font-weight:500}
.drop{border:1.5px dashed #b9b29f;border-radius:6px;padding:18px;text-align:center;background:#fcfbf7;color:var(--muted)}
.drop.over{border-color:var(--navy3);background:var(--blue-soft)}
.bar{height:10px;background:var(--line2);border-radius:5px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--navy3);border-radius:5px}
#toasts{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:99;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:10px 18px;border-radius:5px;font-size:14px;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* ── 홈 ── */
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;border-radius:6px;padding:24px 26px;display:grid;grid-template-columns:1.3fr 1fr;gap:20px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border:30px solid rgba(168,133,47,.18);border-radius:50%}
.hero h1{color:#fff;font-size:24px}
.hero p{color:#d6deec;margin:8px 0 16px;font-size:14px}
.dday{font-family:var(--serif);font-size:54px;font-weight:900;line-height:1;color:#fff}
.dday small{font-size:15px;color:var(--gold-soft);font-family:var(--sans);font-weight:500;display:block;margin-bottom:6px}
@media(max-width:860px){.hero{grid-template-columns:1fr}}
.road{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin-top:4px}
.road div{position:relative;padding:14px 10px 0 0;font-size:13px}
.road div:before{content:"";position:absolute;top:4px;left:0;right:0;height:2px;background:var(--line)}
.road div:after{content:"";position:absolute;top:0;left:0;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--navy3)}
.road div.now:after{background:var(--gold);border-color:var(--gold)}
.road b{display:block;font-family:var(--serif);color:var(--navy);font-size:15px}
@media(max-width:600px){.road{grid-template-columns:1fr 1fr 1fr;row-gap:14px}}

/* ── 문항 ── */
.qitem{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2);align-items:start}
.qitem:last-child{border-bottom:0}
.qno{font-family:var(--serif);color:var(--faint);font-weight:700;min-width:26px}
.qtext{font-weight:500}
.qans{color:var(--muted);font-size:13px;margin-top:4px;white-space:pre-wrap;max-height:3.2em;overflow:hidden}

/* ── 면접실 ── */
.room{position:fixed;inset:0;background:var(--room);color:#e8ecf4;z-index:50;display:flex;flex-direction:column}
.room-top{background:var(--room2);border-bottom:1px solid #2a3858;display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.room-top .ttl{font-family:var(--serif);font-weight:700;font-size:15px}
.room-top .ttl small{display:block;color:#93a0bb;font-family:var(--sans);font-weight:400;font-size:12px}
.pill{background:var(--room3);border:1px solid #34456b;border-radius:20px;padding:3px 12px;font-size:13px;white-space:nowrap}
.pill.gold{border-color:var(--gold);color:#f0d998}
.rec{display:inline-flex;align-items:center;gap:6px;color:#ff8a80;font-weight:700;font-size:13px}
.rec i{width:10px;height:10px;border-radius:50%;background:#ff5247;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.timer{margin-left:auto;text-align:right}
.timer .t{font-family:var(--serif);font-size:32px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.timer .lbl{font-size:12px;color:#93a0bb}
.timer.warn .t{color:#ffc163} .timer.crit .t{color:#ff7b72}
.tbar{height:4px;background:#22304d}
.tbar i{display:block;height:100%;background:var(--gold);transition:width .25s linear}
.room-body{flex:1;display:flex;min-height:0}
.stage{flex:1;display:flex;flex-direction:column;min-width:0;padding:16px;gap:12px;overflow:auto}
.side{width:380px;background:var(--room2);border-left:1px solid #2a3858;padding:16px;overflow:auto;flex:none}
@media(max-width:900px){.side{position:absolute;right:0;top:0;bottom:0;width:min(92vw,380px);z-index:5}}
.side h4{margin:0 0 6px;font-family:var(--serif);color:#f0d998;font-size:14px}
.side .box{background:var(--room3);border-radius:5px;padding:12px;white-space:pre-wrap;font-size:14px;line-height:1.7;margin-bottom:14px}
.paper{background:#fdfcf8;color:var(--ink);border-radius:4px;max-width:880px;width:100%;margin:0 auto;padding:34px 40px;box-shadow:0 10px 40px rgba(0,0,0,.4);border-top:6px solid var(--navy)}
.paper .ph{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:22px;font-family:var(--serif)}
.paper .ph b{font-size:17px}
.paper .qbody{font-family:var(--serif);font-size:21px;line-height:1.85;font-weight:500;white-space:pre-wrap}
.paper .memo{margin-top:22px}
.paper .memo textarea{min-height:150px;background:#fff;font-size:15px}
.qstrip{background:var(--room2);border:1px solid #2a3858;border-radius:5px;padding:10px 14px;font-family:var(--serif);font-size:16px;line-height:1.6;display:flex;gap:10px;align-items:flex-start}
.qstrip span.lab{font-family:var(--sans);font-size:12px;color:var(--gold);border:1px solid var(--gold);border-radius:3px;padding:0 6px;white-space:nowrap;margin-top:3px}
.vgrid{flex:1;display:grid;grid-template-columns:1fr 240px;gap:12px;min-height:300px}
@media(max-width:900px){.vgrid{grid-template-columns:1fr}}
.self{position:relative;background:#000;border-radius:6px;overflow:hidden;border:2px solid #2e7d4f;min-height:280px}
.self video{width:100%;height:100%;object-fit:cover;display:block}
.self video.mirror{transform:scaleX(-1)}
.self .nm{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.6);padding:2px 10px;border-radius:3px;font-size:13px}
.self .cap{position:absolute;left:10%;right:10%;bottom:44px;text-align:center;background:rgba(0,0,0,.55);padding:6px 12px;border-radius:4px;font-size:15px;line-height:1.5}
.self .speaking{position:absolute;right:10px;top:10px;display:flex;gap:2px;align-items:flex-end;height:20px}
.self .speaking i{width:4px;background:#5fd38a;border-radius:2px;height:4px;transition:height .1s}
.panel{display:flex;flex-direction:column;gap:12px}
.judge{flex:1;background:var(--room2);border:1px solid #2a3858;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:80px;color:#93a0bb;font-size:13px}
.judge svg{opacity:.6}
@media(max-width:900px){.panel{flex-direction:row}.judge{min-height:70px}}
.ctrl{background:var(--room2);border-top:1px solid #2a3858;padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.cb{background:var(--room3);border:1px solid #3a4c74;color:#e8ecf4;border-radius:5px;padding:9px 14px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.cb:hover:not(:disabled){background:#2c3d62}
.cb.on{background:#3a2b10;border-color:var(--gold);color:#f0d998}
.cb.recb.on{background:#4a1714;border-color:#ff5247;color:#ffb4ab}
.cb.next{background:var(--gold);border-color:var(--gold);color:#1b1404;font-weight:700}
.cb.end{border-color:#7a3b3b;color:#ffb4ab}
.cb:disabled{opacity:.4;cursor:default}
.ctrl .sep{width:1px;height:26px;background:#3a4c74;margin:0 4px}

/* ── 대기실 ── */
.lobby{max-width:980px;margin:0 auto;width:100%;display:grid;grid-template-columns:1.1fr 1fr;gap:18px;padding:20px}
@media(max-width:900px){.lobby{grid-template-columns:1fr}}
.lobby .self{min-height:300px}
.lob-card{background:var(--room2);border:1px solid #2a3858;border-radius:6px;padding:18px}
.lob-card h3{color:#fff;margin-bottom:10px}
.lob-card ol{margin:0;padding-left:18px;color:#c4ccdc;font-size:14px}
.lob-card li{margin:4px 0}
.meter{height:8px;background:#22304d;border-radius:4px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:#5fd38a;width:0;transition:width .08s}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:#c4ccdc;margin:6px 0}
.ok{color:#5fd38a} .no{color:#ff8a80}

/* ── 결과 ── */
.score-big{display:flex;align-items:baseline;gap:6px}
.score-big b{font-family:var(--serif);font-size:44px;color:var(--navy);line-height:1}
.grade{display:inline-block;font-family:var(--serif);font-weight:900;font-size:20px;width:42px;height:42px;border-radius:50%;border:2px solid var(--gold);color:var(--gold);text-align:center;line-height:38px}
.fb{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
@media(max-width:860px){.fb{grid-template-columns:1fr}}
.fb div{border-radius:5px;padding:12px 14px;font-size:14px}
.fb h4{margin:0 0 6px;font-size:13px}
.fb ul{margin:0;padding-left:18px}
.fb .g{background:var(--green-soft)} .fb .g h4{color:var(--green)}
.fb .w{background:var(--red-soft)} .fb .w h4{color:var(--red)}
.fb .i{background:var(--blue-soft)} .fb .i h4{color:var(--navy2)}
details summary{cursor:pointer;color:var(--navy3);font-size:14px;font-weight:500;margin-top:10px}
.pre{white-space:pre-wrap;font-size:14px;background:var(--paper);padding:10px 12px;border-radius:4px;margin-top:6px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--navy3);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.metric{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;border-bottom:1px dotted var(--line)}
/* ── 합격노트 공통 ── */
.sunseal{border:0;background:transparent;width:40px;height:40px}
.sunbox{background:rgba(255,255,255,.1);border-radius:50%;padding:6px;flex:none;display:grid;place-items:center}
.hero-ghost{background:transparent!important;color:#fff!important;border-color:#6d83ad!important}
.hero-ghost:hover{background:rgba(255,255,255,.08)!important}
.pill-l{display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:20px;padding:4px 12px;font-size:13px}
.quick{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-top:14px}
@media(max-width:860px){.quick{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:520px){.quick{grid-template-columns:repeat(3,minmax(0,1fr))}}
.qc{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.qc:hover{border-color:var(--navy3);box-shadow:0 2px 8px rgba(20,40,75,.08)}
.qc .qi{font-size:22px;line-height:1.2}
.qc b{font-size:14px} .qc small{font-size:12px;color:var(--muted)}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line2);cursor:pointer}
.mrow:last-child{border-bottom:0}
.mrow:hover{background:#fbfaf6}
.mrow .grow{flex:1;min-width:0}
.mrow .grow b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k-tag{color:var(--muted);border-color:var(--line);background:#faf9f5}
.badge{font-size:12px;padding:2px 8px;border-radius:10px;white-space:nowrap}
.b-ok{background:var(--green-soft);color:var(--green)} .b-mid{background:var(--blue-soft);color:var(--navy2)} .b-none{background:#f0eee7;color:var(--muted)}
.mv{width:auto!important;max-width:130px;padding:4px 6px!important;font-size:13px}
.lib{display:grid;grid-template-columns:250px 1fr;gap:14px;align-items:start}
@media(max-width:860px){.lib{grid-template-columns:1fr}}
.secs{position:sticky;top:10px}
.sec{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:8px 10px;font-size:14px}
.sec:hover{background:var(--paper)} .sec.on{background:var(--blue-soft);color:var(--navy);font-weight:700}
.seg{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 14px;font-size:14px}
.seg.on{background:var(--navy);border-color:var(--navy);color:#fff}
.stickies{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.stickies.mini{grid-template-columns:repeat(2,minmax(0,1fr))}
.sticky{border-radius:4px;padding:12px 14px;min-height:96px;box-shadow:0 2px 6px rgba(0,0,0,.07);position:relative}
.sticky .sk{font-size:12px;font-weight:700}
.sticky .stx{margin-top:6px;white-space:pre-wrap;font-size:15px;line-height:1.55}
.sticky .sd{margin-top:8px;font-size:12px;font-weight:500}
.sticky.done .stx{text-decoration:line-through;opacity:.55}
.st-일정{background:#e8eef8;border-top:4px solid var(--navy3)} .st-일정 .sk,.st-일정 .sd{color:var(--navy2)}
.st-공지{background:#fdf1dc;border-top:4px solid var(--amber)} .st-공지 .sk{color:var(--amber)}
.st-다짐{background:#e6f2e8;border-top:4px solid var(--green)} .st-다짐 .sk{color:var(--green)}
.lk{background:none;border:0;padding:0 2px;font-size:12px;color:var(--muted);text-decoration:underline}
.print-only{display:none}
.acctbox{display:flex;align-items:center;gap:6px;margin-right:4px}
.sync{font-size:12px;color:#c9d2e4;white-space:nowrap}
.sync.ok{color:#9fe0b4} .sync.err{color:#ffb4ab} .sync.warn{color:#f0d998}
.acct-mail{font-size:12px;color:#fff;background:rgba(255,255,255,.12);border-radius:12px;padding:2px 9px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:700px){.acct-mail,.sync{display:none}}
.login-ov{position:fixed;inset:0;z-index:80;background:linear-gradient(160deg,#14284b 0%,#1f3a68 60%,#2c4f8a 100%);display:grid;place-items:center;padding:20px}
.login-card{background:#fdfcf8;border-radius:10px;padding:34px 30px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);border-top:5px solid var(--gold)}
.login-card h1{font-size:26px;margin-top:10px}
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px 16px;border:1px solid #dadce0;border-radius:6px;background:#fff;font-size:16px;font-weight:500}
.gbtn:hover{background:#f8f9fa;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.gbtn:disabled{opacity:.6}
.print-head{border-bottom:1px solid #999;padding-bottom:6px;margin-bottom:14px;font-size:12px;color:#444;display:none;justify-content:space-between}
.ytable td input{width:80px;padding:4px 6px}
.ytable th.exam{color:var(--gold)}
.ytable .proj{color:var(--navy3);font-style:italic}
.ytable .ytot td{font-weight:700;border-top:2px solid var(--line)}
.revbox{border:1px solid var(--line);border-radius:6px;padding:10px 14px;background:#fff;min-width:220px}
.revbox.due{border-color:var(--gold);background:var(--gold-soft)}
.revbox .small{color:var(--muted)}
.mtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.mtabs button{border:0;background:none;padding:10px 16px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.mtabs button.on{color:var(--navy);border-bottom-color:var(--gold);font-weight:700}
.mdv{line-height:1.8;font-size:15px}
.mdv .md-h1{font-family:var(--serif);font-size:22px;margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid var(--navy)}
.mdv .md-h2{font-family:var(--serif);font-size:17px;margin:20px 0 6px;color:var(--navy)}
.mdv .md-h3{font-size:15px;margin:14px 0 4px}
.mdv p{margin:6px 0} .mdv ul,.mdv ol{margin:4px 0;padding-left:22px}
.mdv b{background:linear-gradient(transparent 60%, #ffe7a3 60%)}
.mdv .md-row{font-family:ui-monospace,monospace;font-size:13px;white-space:pre-wrap}
.mapwrap{overflow:auto;border:1px solid var(--line2);border-radius:6px;background:#fcfbf7;max-height:72vh;padding:8px}
.mapwrap svg{display:block;max-width:none}

/* ================================================================

================================================================ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];

function toast(msg, ms=2600){ let box=document.getElementById("toasts"); if(!box){ box=document.createElement("div"); box.id="toasts"; document.body.appendChild(box); } while(box.children.length>=3) box.firstChild.remove(); const t=document.createElement("div"); t.className="toast"; t.textContent=msg; box.appendChild(t); setTimeout(()=>t.remove(), ms); }

  {type:"즉답형", q:"[예시 문항] 진로 희망이 없다고 말하는 학생을 상담한다면 어떻게 접근하시겠습니까?", a:"(예시) 공감과 관계 형성 → 흥미·강점 탐색 검사와 경험 활동 → 작은 목표 설정과 지속 관찰"}
];
const DEFAULT_SECTIONS = ["개념서 및 진로상담이론","교육법 및 직무","정책 문서","개정 교육과정","교과서","진로체험","학교현장적용"];
/* 예전 기본 섹션(진로교육론·진로상담 이론·기출)을 새 7개 섹션으로 바꿔요. 자료가 든 섹션은 남겨 둬요. */
function migrateSections(st){
  if(st.sectionsV>=2) return;
  const used = new Set(st.materials.map(x=>x.sectionId));
  const OLD = {"sec-1":"진로교육론","sec-2":"진로상담 이론","sec-3":"기출"};
  st.sections = st.sections.filter(x=>!(OLD[x.id]===x.name && !used.has(x.id)));
  DEFAULT_SECTIONS.forEach((n,i)=>{ if(!st.sections.some(x=>x.name===n)) st.sections.push({id:"s"+(i+1)+"-"+uid().slice(0,4), name:n}); });
  // 새 기본 섹션이 앞에 오도록 정렬
  st.sections.sort((a,b)=>{ const ia=DEFAULT_SECTIONS.indexOf(a.name), ib=DEFAULT_SECTIONS.indexOf(b.name); return (ia<0?99:ia)-(ib<0?99:ib); });
  st.sectionsV = 2;
}

      order:"saved", counts:{"인성":3,"즉답형":2,"구상형":1},
      usePersonality:true, autoRecord:false, liveCaption:true, mirror:true, beep:true,

    },

}
let S;
/* 저장·불러오기는 아래 합격노트 공통(IndexedDB)에서 처리해요 */

/* ───────── 화면 이동 (뒤로/앞으로/홈) ───────── */
const TABS = [["home","홈"],["board","알림판"],["library","자료실"],["notes","빈 노트"],["interview","모의면접"],["bank","문항 관리"],["records","연습 기록"],["quant","정량평가"],["trash","휴지통"],["settings","설정"]];

function go(v, arg, push=true){

$("#nbBack").onclick = () => { if(room.active){ if(!confirm("면접을 중단하고 이전 화면으로 갈까요?")) return; closeRoom(true); return; } if(nav.i>0){ nav.i--; render(); } };
$("#nbPrint").onclick = () => print();
$("#nbFwd").onclick = () => { if(nav.i<nav.stack.length-1){ nav.i++; render(); } };
$("#nbHome").onclick = () => { if(room.active){ if(!confirm("면접을 중단하고 홈으로 갈까요?")) return; closeRoom(true); } go("home"); };

  $("#tabs").innerHTML = TABS.map(([k,l])=>`<button data-k="${k}" class="${(TAB_OF[c]||c)===k?"on":""}">${l}</button>`).join("");
  $$("#tabs button").forEach(b=>b.onclick=()=>go(b.dataset.k));

  $("#nbFwd").disabled = nav.i>=nav.stack.length-1;

function render(){
  renderTabs();
  const {v,arg} = cur();
  const m = $("#main");
  const PAGE_NAMES = {home:"홈", board:"알림판", library:"자료실", material:"자료 보기", notes:"빈 노트", trash:"휴지통", interview:"모의면접", bank:"문항 관리", quant:"정량평가", records:"연습 기록", settings:"설정", report:"모의면접 결과표"};
  ({home:vHome, board:vBoard, library:vLibrary, material:vMaterial, notes:vNotes, trash:vTrash, interview:vInterview, bank:vBank, quant:vQuant, records:vRecords, settings:vSettings, report:vReport}[v]||vHome)(m,arg);
  m.insertAdjacentHTML("afterbegin", `<div class="print-only print-head"><span><b>진로진학 합격노트</b> · ${PAGE_NAMES[v]||""}</span><span>${new Date().toLocaleDateString("ko-KR")} 인쇄</span></div>`);

/* ───────── Gemini API ───────── */
const GAPI = "https://generativelanguage.googleapis.com/v1beta";
const cleanKey = k => String(k||"").replace(/[\s"'`]/g,"");
/* 실패 원인을 쉬운 말로 풀어 줘요 */
function explainApiError(status, msg){
  const m = String(msg||"");
  if(status===0) return "인터넷 연결 또는 보안 프로그램·광고 차단 확장 프로그램이 Google 연결을 막고 있어요. 학교·회사 망이라면 집 와이파이나 휴대폰 핫스팟으로 다시 시도해 보세요.";
  if(/API key not valid|API_KEY_INVALID/i.test(m)) return "API 키가 올바르지 않아요. AI Studio에서 키를 다시 복사해 앞뒤 공백 없이 붙여 넣어 주세요.";
  if(/referer|referrer|blocked|API_KEY_HTTP_REFERRER|has not been used|disabled/i.test(m) || status===403) return "이 키에 사용 제한이 걸려 있어요. AI Studio에서 새 키를 만들거나, Google Cloud 콘솔에서 키의 '애플리케이션 제한'을 '없음'으로 바꿔 주세요. (원문: "+m+")";
  if(status===404 || /not found|is not supported/i.test(m)) return "모델 이름을 찾지 못했어요. [연결 테스트]가 쓸 수 있는 모델을 자동으로 골라 드려요. (원문: "+m+")";
  if(status===429 || /quota|RESOURCE_EXHAUSTED/i.test(m)) return "무료 사용 한도를 넘었어요. 1분쯤 뒤에 다시 시도하거나, 설정에서 더 가벼운 모델(flash-lite)로 바꿔 보세요.";
  if(/location|region|not available in your country/i.test(m)) return "현재 위치에서 이 모델을 쓸 수 없다고 나와요. (원문: "+m+")";
  return (status?`오류 ${status}: `:"") + m;
}
async function apiFetch(path, opts={}){
  const key = cleanKey(S.settings.apiKey);
  let r;
  try{ r = await fetch(`${GAPI}/${path}`, {...opts, headers:{...(opts.headers||{}), "x-goog-api-key":key}}); }
  catch(e){
    // 헤더 방식이 막히면 주소에 키를 붙여 한 번 더 시도
    try{ r = await fetch(`${GAPI}/${path}${path.includes("?")?"&":"?"}key=${encodeURIComponent(key)}`, opts); }
    catch(e2){ const err=new Error(explainApiError(0)); err.status=0; throw err; }
  }
  const d = await r.json().catch(()=>({}));
  if(!r.ok){ const err=new Error(explainApiError(r.status, d?.error?.message)); err.status=r.status; throw err; }
  return d;
}
/* ───── 모델 목록: 키로 쓸 수 있는 모든 Gemini 버전을 불러와 골라 쓰기 ───── */
const ver = n => parseFloat((n.match(/gemini-(\d+(\.\d+)?)/)||[])[1])||0;
// 채점은 정확도(pro) 우선, 파일 분석은 속도(flash) 우선으로 '자동' 순위를 매겨요
function rankFor(task, n){
  if(/live|tts|image|audio|embedding|aqa|robotics|computer-use/.test(n)) return -999;
  let s = ver(n)*10;
  if(task==="grade"){ if(/pro/.test(n)) s+=30; else if(/flash(?!-lite)/.test(n)) s+=20; }
  else { if(/flash(?!-lite)/.test(n)) s+=30; else if(/pro/.test(n)) s+=15; else if(/lite/.test(n)) s+=10; }
  if(/preview|exp/.test(n)) s-=8;
  return s;
}
async function loadModelList(){
  const d = await apiFetch("models?pageSize=200");
  const list = (d.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent") && /gemini/.test(m.name))
    .map(m=>({id:m.name.replace(/^models\//,""), label:m.displayName||m.name}))
    .filter(m=>rankFor("parse",m.id)>-999)
    .sort((a,b)=>ver(b.id)-ver(a.id) || a.id.localeCompare(b.id));
  if(!list.length) throw new Error("이 키로 쓸 수 있는 Gemini 모델이 없어요.");
  S.settings.modelList = list; S.settings.modelListAt = new Date().toISOString(); save();
  return list;
}
/* 작업별로 시도할 모델 순서: 고른 모델 → (자동 전환이 켜져 있으면) 다른 버전들 */
function modelChain(task){
  const st = S.settings, ids = (st.modelList||[]).map(m=>m.id);
  const auto = [...ids].sort((a,b)=>rankFor(task,b)-rankFor(task,a)).filter(n=>rankFor(task,n)>-999);
  const chosen = (st.models||{})[task] || "auto";
  let chain = chosen==="auto" ? auto : [chosen, ...auto.filter(x=>x!==chosen)];
  if(!chain.length) chain = [chosen==="auto" ? "gemini-flash-latest" : chosen];
  return st.fallback===false ? chain.slice(0,1) : chain.slice(0,4);
}
async function gemini(parts, {json=true, temperature=0.4, task="parse"}={}){
  if(!cleanKey(S.settings.apiKey)) throw new Error("NOKEY");
  if(!(S.settings.modelList||[]).length){ try{ await loadModelList(); }catch(e){ if(e.status!==0) throw e; } }
  const chain = modelChain(task);
  let lastErr, d;
  for(const model of chain){
    try{
      d = await apiFetch(`models/${encodeURIComponent(model)}:generateContent`, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({contents:[{role:"user", parts}], generationConfig: json?{responseMimeType:"application/json", temperature}:{temperature}})
      });
      gemini.lastModel = model;
      break;
    }catch(e){
      lastErr = e;
      // 모델 없음·한도 초과·서버 혼잡일 때만 다음 버전으로 넘어가요 (키 문제는 바로 알려 줘요)
      if(![404,429,500,503].includes(e.status)) throw e;
    }
  }
  if(!d) throw lastErr;
  const txt = (d.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("");
  if(!json) return txt;
  try { return JSON.parse(txt.replace(/^```(json)?\s*|\s*```$/g,"")); } catch(e){ throw new Error("AI 응답을 해석하지 못했어요. 다시 시도해 주세요."); }
}
const blobToB64 = b => new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(",")[1]); fr.onerror=rej; fr.readAsDataURL(b); });
async function fileToPart(file){
  const ext = file.name.split(".").pop().toLowerCase();
  const mime = file.type || ({pdf:"application/pdf",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg"}[ext]) || "application/octet-stream";
  return {inline_data:{mime_type: mime==="image/jpg"?"image/jpeg":mime, data: await blobToB64(file)}};
}
async function sheetToText(file){
  needXLSX();
  const wb = XLSX.read(await file.arrayBuffer(), {type:"array"});
  return wb.SheetNames.map(n=>`[시트: ${n}]\n` + XLSX.utils.sheet_to_csv(wb.Sheets[n])).join("\n\n");
}
function parseCSV(t){
  const rows=[]; let row=[], cell="", q=false;
  t=t.replace(/^\uFEFF/,"");
  for(let i=0;i<t.length;i++){ const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c; }
    else if(c==='"') q=true; else if(c===","){ row.push(cell); cell=""; }
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&t[i+1]==="\n") i++; row.push(cell); rows.push(row); row=[]; cell=""; }
    else cell+=c; }
  if(cell||row.length){ row.push(cell); rows.push(row); }
  return rows;
}

/* 녹음(webm) → 16kHz 모노 WAV: AI가 가장 안정적으로 듣는 형식 */
async function toWav(blob){
  const buf = await blob.arrayBuffer();
  const ac = new (window.AudioContext||window.webkitAudioContext)();
  const audio = await ac.decodeAudioData(buf); ac.close();
  const rate = 16000, len = Math.ceil(audio.duration*rate);
  const off = new OfflineAudioContext(1, len, rate);
  const src = off.createBufferSource(); src.buffer = audio; src.connect(off.destination); src.start();
  const out = (await off.startRendering()).getChannelData(0);
  const dv = new DataView(new ArrayBuffer(44 + out.length*2));
  const w = (o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i));};
  w(0,"RIFF"); dv.setUint32(4,36+out.length*2,true); w(8,"WAVE"); w(12,"fmt "); dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,rate,true); dv.setUint32(28,rate*2,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true); w(36,"data"); dv.setUint32(40,out.length*2,true);
  for(let i=0;i<out.length;i++){ const s=Math.max(-1,Math.min(1,out[i])); dv.setInt16(44+i*2, s<0?s*0x8000:s*0x7fff, true); }
  return new Blob([dv], {type:"audio/wav"});
}

function trendSvg(arr){

const cnt = ty => Math.max(0, Math.floor(+((S.settings.counts||{})[ty] ?? 0)));
function pickType(ty, n, shuffleNow=true){

/* 카메라·마이크를 따로 요청해요. 요청하는 순간 크롬이 '허용/차단' 팝업을 띄워요. */
const CONSTRAINTS = {video:{width:{ideal:1280},height:{ideal:720}}, audio:{echoCancellation:true, noiseSuppression:true}};
function hasTrack(kind){ return !!media.stream && media.stream.getTracks().some(t=>t.kind===kind && t.readyState==="live"); }
async function requestDevice(kind){   // kind: "video" | "audio"
  if(hasTrack(kind)) return;
  if(!navigator.mediaDevices?.getUserMedia){ const e=new Error("unsupported"); e.name="Unsupported"; throw e; }
  const st = await navigator.mediaDevices.getUserMedia({[kind]:CONSTRAINTS[kind]});
  if(!media.stream) media.stream = new MediaStream();
  st.getTracks().forEach(t=>media.stream.addTrack(t));
  if(kind==="audio"){
    media.audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
    const src = media.audioCtx.createMediaStreamSource(new MediaStream(st.getAudioTracks()));
    media.analyser = media.audioCtx.createAnalyser(); media.analyser.fftSize = 512; src.connect(media.analyser);
  }
}
async function ensureMedia(){
  // 둘을 한 번에 요청하면 팝업 하나로 카메라·마이크를 같이 물어봐요
  if(!hasTrack("video") && !hasTrack("audio") && navigator.mediaDevices?.getUserMedia){
    try{ const st = await navigator.mediaDevices.getUserMedia(CONSTRAINTS); media.stream = new MediaStream(); st.getVideoTracks().forEach(t=>media.stream.addTrack(t));
      media.audioCtx ||= new (window.AudioContext||window.webkitAudioContext)(); const a=new MediaStream(st.getAudioTracks()); a.getTracks().forEach(t=>media.stream.addTrack(t));
      const src = media.audioCtx.createMediaStreamSource(a); media.analyser = media.audioCtx.createAnalyser(); media.analyser.fftSize = 512; src.connect(media.analyser); return media.stream; }
    catch(e){ /* 하나라도 막히면 아래에서 따로 다시 물어봐요 */ }
  }
  const errs = {};
  for(const k of ["video","audio"]){ try{ await requestDevice(k); }catch(e){ errs[k]=e; } }
  if(Object.keys(errs).length){ const e=new Error("media"); e.parts=errs; throw e; }
  return media.stream;
}
function mediaHelp(kind, e){

/* 단계 전환 */
function beginRead(){
  room.phase="read"; room.memo=""; room.showAns=false; stopTimer();
  beep(740,.12);
  renderRoom();
}
function beginAnswer(isRetry){
  stopTimer();
  room.phase="answer"; room.transcript=""; room.interim="";
  if(!isRetry) beep(988,.18);
  renderRoom();
  startAnswerCapture();
  startTimer(typeTimes(curItem()).answer, ()=>{ toast("답변 시간이 끝났어요."); finishAnswer(); });
}
function startAnswerCapture(){
  room.answerStart = Date.now();
  room.audioChunks=[];
  try{
    const aStream = new MediaStream(media.stream.getAudioTracks());
    room.audioRec = new MediaRecorder(aStream, MediaRecorder.isTypeSupported("audio/webm;codecs=opus")?{mimeType:"audio/webm;codecs=opus"}:{});
    room.audioRec.ondataavailable = e=>{ if(e.data.size) room.audioChunks.push(e.data); };
    room.audioRec.start(1000);
  }catch(e){ room.audioRec=null; }
  startSR();
}
function stopAnswerCapture(discard){
  return new Promise(res=>{
    stopSR();
    const r = room.audioRec; room.audioRec=null;
    if(!r || r.state==="inactive"){ res(discard?null:(room.audioChunks.length?new Blob(room.audioChunks,{type:"audio/webm"}):null)); return; }
    r.onstop = ()=> res(discard?null:new Blob(room.audioChunks,{type:r.mimeType||"audio/webm"}));
    r.stop();
  });
}
/* 실시간 음성 인식 */
function startSR(){
  const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return;
  const sr = new SR(); sr.lang="ko-KR"; sr.continuous=true; sr.interimResults=true;
  sr.onresult = e=>{ let fin="", inter=""; for(let i=e.resultIndex;i<e.results.length;i++){ const t=e.results[i][0].transcript; if(e.results[i].isFinal) fin+=t+" "; else inter+=t; } room.transcript+=fin; room.interim=inter; updateCaption(); };
  sr.onend = ()=>{ if(room.sr===sr && room.phase==="answer"){ try{sr.start();}catch(e){} } };
  sr.onerror = ()=>{};
  room.sr = sr; try{ sr.start(); }catch(e){}
}
function stopSR(){ const sr=room.sr; room.sr=null; try{ sr&&sr.stop(); }catch(e){} }
function updateCaption(){ const c=$("#cap"); if(!c) return; const full=(room.transcript+" "+room.interim).trim(); c.classList.toggle("hidden",!full); c.textContent = full.length>90? "…"+full.slice(-90) : full; }

async function finishAnswer(thenEnd){
  if(room.phase!=="answer") return;
  const it = curItem();
  const used = Math.min(typeTimes(it).answer, (Date.now()-room.answerStart)/1000);
  stopTimer();
  room.phase="saving";
  const audio = await stopAnswerCapture(false);
  const res = {qid:it.id, type:it.type, stage:it.stage, q:it.q, a:it.a, memo:room.memo, limit:typeTimes(it).answer, used:Math.round(used), transcript:(room.transcript+" "+room.interim).trim(), audio, status:"pending", ai:null};
  res.metrics = localMetrics(res);
  room.results.push(res);
  gradeQueue.push(res); runGradeQueue();
  if(thenEnd===true || room.idx>=room.items.length-1) return endInterview();
  room.idx++; beginRead();
}
function skipPersonality(){
  const first = room.items.findIndex(x=>x.stage==="본");
  if(first<0){ toast("본 문항이 없어요."); return; }
  if(!confirm("기본 인성 문항을 건너뛰고 본 문항으로 갈까요?")) return;
  stopTimer(); stopAnswerCapture(true);
  room.idx = first; beginRead();
}

/* 동영상 녹화 → 바탕화면 저장 */
function recMime(){ for(const m of ["video/mp4;codecs=avc1,mp4a","video/mp4","video/webm;codecs=vp9,opus","video/webm"]) if(window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m; return ""; }
function startRecord(){
  if(!media.stream) return;
  const mime = recMime();
  room.recChunks=[];
  room.rec = new MediaRecorder(media.stream, mime?{mimeType:mime, videoBitsPerSecond:2_000_000}:{});
  room.rec.ondataavailable = e=>{ if(e.data.size) room.recChunks.push(e.data); };
  room.rec.start(1000);
  toast("녹화를 시작했어요.");
  if(room.active && room.phase!=="lobby") renderRoom();
}
async function toggleRecord(){
  if(!room.rec || room.rec.state==="inactive"){ startRecord(); return; }
  // 버튼을 누른 순간에 저장 창을 먼저 띄워야 브라우저가 허용해요.
  const ext = (room.rec.mimeType||"").includes("mp4")?"mp4":"webm";
  const name = `모의면접_${new Date().toISOString().slice(0,16).replace(/[-:T]/g,"").replace(/^(\d{8})/,"$1_")}.${ext}`;
  let handle=null;
  if(window.showSaveFilePicker){
    try{ handle = await showSaveFilePicker({suggestedName:name, startIn:"desktop", types:[{description:"면접 영상", accept:{[ext==="mp4"?"video/mp4":"video/webm"]:["."+ext]}}]}); }
    catch(e){ if(e.name==="AbortError"){ toast("저장을 취소했어요. 녹화는 계속돼요."); return; } }
  }
  const blob = await new Promise(res=>{ room.rec.onstop=()=>res(new Blob(room.recChunks,{type:room.rec.mimeType||"video/webm"})); room.rec.stop(); });
  await saveBlob(blob, name, handle);
  if(room.active && room.phase!=="lobby") renderRoom();
}
async function saveBlob(blob, name, handle){
  try{
    if(handle){ const w=await handle.createWritable(); await w.write(blob); await w.close(); toast(`영상을 저장했어요: ${handle.name}`, 4000); return; }
  }catch(e){}
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 20000);
  toast("영상을 '다운로드' 폴더에 저장했어요.", 4000);
}

function endInterview(){
  stopTimer(); stopSR();
  const pendingRec = room.rec && room.rec.state==="recording";
  const finalize = (blob)=>{
    logStudy();
    const session = {id:room.id, date:room.started, duration: room.examStart? Math.round((Date.now()-room.examStart)/1000) : 0, items:room.results.map(r=>({...r, audio:undefined})), avg:null};
    recalc(session);
    S.history.push(session); save();
    liveSessions[session.id] = room.results;   // 재채점용 음성은 이 탭에만 보관
    if(blob) liveVideo[session.id] = blob;
    stopMedia(); room.active=false; document.body.style.overflow=""; $("#roomRoot").innerHTML="";
    go("report", session.id);
    if(!room.results.length) toast("답변한 문항이 없어요.");
  };
  if(pendingRec){ room.rec.onstop=()=>finalize(new Blob(room.recChunks,{type:room.rec.mimeType||"video/webm"})); room.rec.stop(); }
  else finalize(null);
}
const liveSessions = {}, liveVideo = {};

/* ───────── 채점 ───────── */
function localMetrics(r){
  const t = r.transcript||"";
  const chars = t.replace(/\s/g,"").length;
  const fillers = (t.match(/(^|\s)(음+|어+|그+|저기|약간|뭐랄까|그러니까)(?=\s|$)/g)||[]).length;
  const spm = r.used>5 ? Math.round(chars/(r.used/60)) : 0;
  return {chars, fillers, spm, usage: Math.round(r.used/r.limit*100)};
}
const gradeQueue=[]; let grading=false;
async function runGradeQueue(){
  if(grading) return; grading=true;
  while(gradeQueue.length){
    const r = gradeQueue.shift();
    if(!S.settings.apiKey){ r.status="nokey"; syncResult(r); continue; }
    r.status="grading"; syncResult(r);
    try{ r.ai = await gradeAnswer(r); r.status="done"; }
    catch(e){ r.status="error"; r.err=e.message; }
    syncResult(r);
  }
  grading=false;
}
async function gradeAnswer(r){

`당신은 경기도교육청 진로진학상담 선발교사 온라인 면접의 숙련된 평가위원입니다.

[문항] ${r.q}
[응시자가 준비한 예상 답안(참고용, 평가 대상 아님)] ${r.a||"없음"}
[구상 메모] ${r.memo||"없음"}
[제한 시간] ${r.limit}초 / [실제 답변 시간] ${r.used}초
[브라우저 실시간 받아쓰기(부정확할 수 있음)] ${r.transcript||"없음"}

[루브릭]
${rub.map((x,i)=>`${i+1}. ${x.name} (${x.max}점): ${x.desc}`).join("\n")}

음성 파일이 첨부되어 있으면 음성을 우선으로 듣고 정확히 받아 적은 뒤 평가하세요. 발음·속도·간투사·침묵도 '전달력' 평가에 반영하세요.
답변이 거의 없으면 낮은 점수를 주고 그 이유를 밝히세요.

다음 JSON 형식으로만 답하세요:
{"transcript":"답변 전사문","scores":[{"item":"루브릭 항목명","score":정수,"max":정수,"reason":"한두 문장 근거"}],
"strengths":["잘한 점"],"weaknesses":["부족한 점(구체적으로)"],"improvements":["다음 연습에서 바로 고칠 개선 방향"],

  if(r.audio && r.audio.size>2000){
    try{ const wav = await toWav(r.audio); if(wav.size < 18*1024*1024) parts.push({inline_data:{mime_type:"audio/wav", data: await blobToB64(wav)}}); }catch(e){}
  }
  const out = await gemini(parts, {task:"grade"});
  out.ai_model = gemini.lastModel;
  out.scores = (out.scores||[]).map((s,i)=>({item:s.item||rub[i]?.name, max:+s.max||rub[i]?.max||20, score:Math.max(0,Math.min(+s.max||rub[i]?.max||20, Math.round(+s.score||0))), reason:s.reason||""}));
  const max = out.scores.reduce((a,s)=>a+s.max,0)||1;
  out.total = Math.round(out.scores.reduce((a,s)=>a+s.score,0)/max*100);
  return out;
}
function recalc(h){ const done=h.items.filter(x=>x.ai); h.avg = done.length? Math.round(done.reduce((a,x)=>a+x.ai.total,0)/done.length) : null; }
function syncResult(r){

}

  const msg=$("#bMsg"), def=$("#bDef").value; let added=0; const errs=[];
  for(const f of files){
    const k=fileKind(f.name);
    msg.innerHTML=`<p class="small"><span class="spin"></span> ${esc(f.name)} 읽는 중…</p>`;
    try{
      if(k==="hancom"){ errs.push(`${f.name}: ${HANCOM_MSG}`); continue; }
      if(k==="sheet"){
        const rows = (f.name.toLowerCase().endsWith(".csv") ? parseCSV(await f.text()) : sheetRows(await f.arrayBuffer())).filter(r=>r.some(c=>String(c).trim()));
        if(!rows.length) continue;
        const h = rows[0].map(c=>String(c));
        let ci={t:h.findIndex(x=>/유형|구분/.test(x)), q:h.findIndex(x=>/문제|문항|질문/.test(x)), a:h.findIndex(x=>/답/.test(x))};
        let body=rows.slice(1);
        if(ci.q<0){ ci={t:-1,q:0,a:1}; body=rows; }
        for(const r of body){ const q=String(r[ci.q]||"").trim(); if(!q) continue; S.questions.push({id:uid(), type:normType(ci.t>=0?r[ci.t]:"", def), q, a:String(ci.a>=0?r[ci.a]||"":"").trim(), src:f.name, created:Date.now()}); added++; }
      } else if(k==="visual"){
        const out = await gemini([{text:`이 자료에서 면접 문제와 그에 대한 예상 답안(모범 답안)을 모두 찾아 정리하세요. 문항 유형(인성/구상형/즉답형)이 적혀 있으면 그대로 쓰고, 적혀 있지 않아도 지원 동기·교사상·각오·자기소개처럼 지원자의 인성을 묻는 문항이면 "인성"으로, 판단이 어려우면 빈 문자열로 두세요. 원문을 바꾸지 말고 그대로 옮기세요.
JSON 형식: {"items":[{"type":"","question":"","answer":""}]}`}, await fileToPart(f)]);
        for(const it of (out.items||[])){ if(!it.question) continue; S.questions.push({id:uid(), type:normType(it.type,def), q:it.question.trim(), a:(it.answer||"").trim(), src:f.name, created:Date.now()}); added++; }
      } else errs.push(`${f.name}: 지원하지 않는 형식이에요.`);
    }catch(e){ errs.push(`${f.name}: ${e.message==="NOKEY"?"PDF·사진 분석은 설정에서 Gemini API 키를 넣어야 해요.":e.message}`); }
  }
  save(); render();
  const box=$("#bMsg"); box.innerHTML = `${added?`<p class="note" style="margin-top:10px">${added}개 문항을 저장했어요.</p>`:""}${errs.map(e=>`<p class="note warn" style="margin-top:8px">${esc(e)}</p>`).join("")}`;
}

/* 연도별 정량 점수: 기록한 해 + 시험 볼 해(2027~2030) 예상 */
const EXAM_YEARS = [2027,2028,2029,2030];
function yearlyCard(C, max){
  const Q=S.quant, now=new Date().getFullYear();
  const snaps = Q.snapshots.filter(s=>s.items);
  const years = [...new Set([...snaps.map(s=>s.year), now, ...EXAM_YEARS])].sort((a,b)=>a-b);
  const snapOf = y => snaps.find(s=>s.year===y);
  // 예상: 가장 최근 기록(없으면 지금 점수)에서 해마다 + 만큼, 만점까지
  const last = [...snaps].filter(s=>s.year<=now).pop();
  const baseYear = snapOf(now) ? now : (last ? Math.max(last.year, now) : now);
  const baseVal = c => { const sn=snapOf(baseYear); return sn ? (+sn.items[c.id]||0) : (+c.mine||0); };
  const val = (c,y) => { const sn=snapOf(y); if(sn) return {v:+sn.items[c.id]||0, kind:"rec"}; if(y===now) return {v:+c.mine||0, kind:"now"}; if(y>baseYear){ const v=Math.min(+c.max||Infinity, baseVal(c)+(+c.perYear||0)*(y-baseYear)); return {v:Math.round(v*100)/100, kind:"proj"}; } return {v:null, kind:"none"}; };
  const tot = y => { const vs=C.map(c=>val(c,y)); if(vs.every(x=>x.v==null)) return null; return Math.round(vs.reduce((a,x)=>a+(x.v||0),0)*100)/100; };
  const rising = C.filter(c=>+c.perYear>0);
  const cell = (c,y) => { const r=val(c,y); if(r.kind==="rec") return `<input type="number" step="0.01" class="num" data-py="${y}" data-c="${c.id}" value="${r.v}">`; if(r.v==null) return `<span class="faint">–</span>`; return `<span class="${r.kind==="proj"?"proj":""}">${r.v}${r.kind==="proj"&&+c.perYear>0&&r.v>=(+c.max||Infinity)?" <small>만점</small>":""}</span>`; };
  const W=640,H=150,p=28, ys=years.map(tot), vmax=Math.max(max||0, ...ys.filter(v=>v!=null))||1, bw=Math.min(56,(W-2*p)/years.length*0.6);
  const bx = i => p + (i+.5)*(W-2*p)/years.length;
  const chart = `<svg viewBox="0 0 ${W} ${H+24}" style="width:100%;max-width:${W}px;height:auto" role="img" aria-label="연도별 정량 점수">
    <line x1="${p}" x2="${W-p}" y1="${H}" y2="${H}" stroke="#dcd7ca"/>
    ${years.map((y,i)=>{ const v=ys[i]; if(v==null) return `<text x="${bx(i)}" y="${H+16}" text-anchor="middle" font-size="11" fill="#8a8f9b">${y}</text>`; const h=(v/vmax)*(H-24), k=snapOf(y)?"rec":y===now?"now":"proj";
      return `<rect x="${bx(i)-bw/2}" y="${H-h}" width="${bw}" height="${h}" rx="3" fill="${k==="proj"?"#c9d4ea":"#2c4f8a"}" ${k==="proj"?'stroke="#2c4f8a" stroke-dasharray="3 3"':""}/><text x="${bx(i)}" y="${H-h-5}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c1f26">${v}</text><text x="${bx(i)}" y="${H+16}" text-anchor="middle" font-size="11" fill="${EXAM_YEARS.includes(y)?"#a8852f":"#5b6170"}" font-weight="${EXAM_YEARS.includes(y)?700:400}">${y}${EXAM_YEARS.includes(y)?" 시험":""}</text>`; }).join("")}
  </svg>`;
  return `<div class="card" style="margin-top:14px">
    <div class="row" style="justify-content:space-between;margin-bottom:6px"><h3 style="margin:0">연도별 정량 점수</h3><button class="btn sm ghost" id="qPast">지난 연도 추가</button></div>
    <p class="small muted" style="margin:0 0 10px">진한 막대는 기록한 점수, 점선 막대는 해마다 오르는 점수(산출표의 <b>해마다 +</b>)로 계산한 예상 점수예요. 매년 [${now}년 점수로 기록]을 눌러 두면 실제 변화가 쌓여요.</p>
    ${chart}
    ${rising.length? `<p class="note" style="margin:10px 0">해마다 오르는 항목: ${rising.map(c=>`<b>${esc(c.item||"항목")}</b> +${c.perYear}`).join(" · ")}</p>` : `<p class="note warn" style="margin:10px 0">교육경력처럼 해마다 오르는 항목은 산출표의 <b>해마다 +</b> 칸에 1년에 오르는 점수를 넣어 주세요. 그래야 시험 연도별 예상 점수가 계산돼요.</p>`}
    <div style="overflow-x:auto"><table class="ytable"><tr><th>항목</th><th class="num">만점</th>${years.map(y=>`<th class="num ${EXAM_YEARS.includes(y)?"exam":""}">${y}${snapOf(y)?` <button class="lk" data-pydel="${y}" title="${y}년 기록 지우기">✕</button>`:y===now?" <small>(현재)</small>":y>baseYear?" <small>(예상)</small>":""}</th>`).join("")}</tr>
      ${C.map(c=>`<tr><td>${esc(c.item||"항목")}${+c.perYear>0?` <span class="small" style="color:var(--green)">▲${c.perYear}/년</span>`:""}</td><td class="num">${esc(c.max)}</td>${years.map(y=>`<td class="num">${cell(c,y)}</td>`).join("")}</tr>`).join("")}

}

async function filePartsForAI(f){
  const k=fileKind(f.name);
  if(k==="hancom") throw new Error(HANCOM_MSG);
  if(k==="sheet") return {text:`[파일: ${f.name}]\n` + await sheetToText(f)};
  if(k==="visual") return await fileToPart(f);
  throw new Error("지원하지 않는 형식이에요.");
}
async function importCriteria(f){
  if(!f) return; const msg=$("#qMsg");
  msg.innerHTML=`<p class="note" style="margin-top:12px"><span class="spin"></span> ${esc(f.name)}에서 정량평가 산출 방식을 정리하는 중…</p>`;
  try{
    // API 키가 없으면 엑셀 표를 그대로 읽어요
    if(!S.settings.apiKey && fileKind(f.name)==="sheet"){
      const rows=sheetRows(await f.arrayBuffer()); const h=(rows[0]||[]).map(String);
      const ix=re=>h.findIndex(x=>re.test(x));
      const c={a:ix(/영역|구분/), i:ix(/항목|내용/), m:ix(/산출|방법|기준/), x:ix(/배점|만점|점수/)};

async function importRecords(f){

JSON: {"items":[{"index":숫자,"score":숫자,"evidence":"계산 근거"}],"priorities":[{"item":"항목","gap":"추가 가능 점수","action":"구체적 보완 방법"}],"notes":"종합 의견 2문장"}`}, await filePartsForAI(f)]);

   합격노트 공통: 저장소(IndexedDB) · 학습 기록 · 마크다운
================================================================ */
const IDB_NAME = "jj-hapgyeok-note";
let _db = null;
function idb(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    const r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = ()=>{ const d=r.result; if(!d.objectStoreNames.contains("kv")) d.createObjectStore("kv"); if(!d.objectStoreNames.contains("blobs")) d.createObjectStore("blobs"); };
    r.onsuccess = ()=>{ _db=r.result; res(_db); };
    r.onerror = ()=>rej(r.error);
  });
}
async function idbGet(store, key){ const d=await idb(); return new Promise((res,rej)=>{ const q=d.transaction(store).objectStore(store).get(key); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
async function idbPut(store, key, val){ const d=await idb(); return new Promise((res,rej)=>{ const tx=d.transaction(store,"readwrite"); tx.objectStore(store).put(val,key); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function idbDel(store, key){ const d=await idb(); return new Promise((res,rej)=>{ const tx=d.transaction(store,"readwrite"); tx.objectStore(store).delete(key); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }

function mergeState(d){
  const base = defaults();
  return {...base, ...d,
    settings:{...base.settings, ...(d.settings||{}), times:{...base.settings.times, ...((d.settings||{}).times||{})}, counts:{...base.settings.counts, ...((d.settings||{}).counts||{})}},
    quant:{...base.quant, ...(d.quant||{})},
    sections: d.sections || base.sections, sectionsV: d.sections ? (d.sectionsV||1) : 2, materials: d.materials || [], notes: d.notes || [], board: d.board || [], studyLog: d.studyLog || []};
}
let _saveChain = Promise.resolve(), _saveQueued = false, _useLS = false;

const addDays = (ds, n) => { const d=new Date(ds+"T00:00:00"); d.setDate(d.getDate()+n); return d.toLocaleDateString("sv-SE"); };
const todayL = () => new Date().toLocaleDateString("sv-SE");   // 한국 시간 기준 날짜
const dDiff = ds => Math.round((new Date(ds+"T00:00:00") - new Date(todayL()+"T00:00:00"))/86400000);
function logStudy(){ const d=todayL(); if(!S.studyLog.includes(d)){ S.studyLog.push(d); save(); } }
function studyStreak(){
  const set = new Set([...S.studyLog, ...S.history.map(h=>new Date(h.date).toLocaleDateString("sv-SE"))]);
  let n = set.has(todayL()) ? 0 : 1, c = 0;
  while(set.has(addDays(todayL(), -n))){ c++; n++; }
  return c;
}
/* 아주 작은 마크다운 → HTML (정제본 표시용) */
function md(src){
  const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  const out = []; let list = null;
  const close = ()=>{ if(list){ out.push(`</${list}>`); list=null; } };
  for(const raw of String(src||"").split("\n")){
    const l = raw.trimEnd();
    let m;
    if(!l.trim()){ close(); continue; }
    if((m=l.match(/^(#{1,3})\s+(.*)/))){ close(); const lv=m[1].length; out.push(`<h${lv+1} class="md-h${lv}">${inl(m[2])}</h${lv+1}>`); continue; }
    if((m=l.match(/^\s*[-*•]\s+(.*)/))){ if(list!=="ul"){ close(); out.push("<ul>"); list="ul"; } out.push(`<li>${inl(m[1])}</li>`); continue; }
    if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){ if(list!=="ol"){ close(); out.push("<ol>"); list="ol"; } out.push(`<li>${inl(m[1])}</li>`); continue; }
    if(/^\|/.test(l)){ close(); out.push(`<div class="md-row">${inl(l)}</div>`); continue; }
    close(); out.push(`<p>${inl(l)}</p>`);
  }
  close(); return out.join("");
}

function mimeOf(ext, blob){ return blob.type || ({pdf:"application/pdf",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp"}[ext]) || "application/octet-stream"; }
async function zipText(blob, ext){
  if(!window.JSZip) throw new Error("압축 파일 읽기 도구를 불러오지 못했어요. 인터넷에 연결된 상태에서 다시 열어 주세요.");
  const zip = await JSZip.loadAsync(await blob.arrayBuffer());
  const xml = async p => new DOMParser().parseFromString(await zip.file(p).async("string"), "application/xml");
  const byNum = re => Object.keys(zip.files).filter(n=>re.test(n)).sort((a,b)=>(+a.match(/(\d+)\.xml$/)[1])-(+b.match(/(\d+)\.xml$/)[1]));
  if(ext==="docx"){ const d=await xml("word/document.xml"); return [...d.getElementsByTagName("w:p")].map(p=>p.textContent).join("\n"); }
  if(ext==="pptx"){ const out=[]; for(const [i,f] of byNum(/^ppt\/slides\/slide\d+\.xml$/).entries()){ const d=await xml(f); out.push(`[슬라이드 ${i+1}]\n`+[...d.getElementsByTagName("a:p")].map(p=>p.textContent).filter(Boolean).join("\n")); } return out.join("\n\n"); }
  if(ext==="hwpx"){ const out=[]; for(const f of byNum(/^Contents\/section\d+\.xml$/)){ const d=await xml(f); out.push([...d.getElementsByTagName("hp:p")].map(p=>p.textContent).join("\n")); } return out.join("\n\n"); }
  throw new Error("지원하지 않는 형식이에요.");
}
async function extractText(x){
  if(x.ext==="link"){
    const g = x.url.match(/docs\.google\.com\/spreadsheets\/d\/([\w-]+)/);
    if(g){ try{ const r=await fetch(`https://docs.google.com/spreadsheets/d/${g[1]}/export?format=csv`); if(r.ok){ const t=await r.text(); if(!/<html/i.test(t)) return t; } }catch(e){} throw new Error("구글시트를 바로 읽지 못했어요. 시트에서 [파일 → 다운로드 → Microsoft Excel]로 받아 자료실에 올려 주세요."); }
    throw new Error("웹 링크는 글자를 바로 가져올 수 없어요. 내용을 복사해 텍스트 칸에 붙여넣어 주세요.");
  }
  const blob = await idbGet("blobs", x.id);
  if(!blob) throw new Error("원본 파일을 찾지 못했어요.");
  const e = x.ext;
  if(["txt","md","csv"].includes(e)) return await blob.text();
  if(["xlsx","xls"].includes(e)){ needXLSX(); const wb=XLSX.read(await blob.arrayBuffer(),{type:"array"}); return wb.SheetNames.map(n=>`[시트: ${n}]\n`+XLSX.utils.sheet_to_csv(wb.Sheets[n])).join("\n\n"); }
  if(["docx","pptx","hwpx"].includes(e)) return await zipText(blob, e);
  if(["pdf","png","jpg","jpeg","gif","webp"].includes(e)){
    if(blob.size > 18*1048576) throw new Error("파일이 18MB보다 커서 AI가 한 번에 읽을 수 없어요. 쪽을 나눠 올려 주세요.");
    return await gemini([{text:"이 자료의 글자를 빠짐없이 원문 그대로 옮겨 적으세요. 제목과 목록 구조는 줄바꿈으로 살리고, 표는 칸을 '|'로 구분한 줄로 적으세요. 설명이나 요약은 덧붙이지 마세요."}, {inline_data:{mime_type:mimeOf(e,blob), data:await blobToB64(blob)}}], {json:false, task:"parse"});
  }
  throw new Error("이 형식은 자동 변환이 어려워요. PDF로 저장해 올리거나 직접 붙여넣어 주세요.");
}

[자료]
${x.text.slice(0,120000)}`}], {json:false, task:"parse"});

function runMap(x){

[자료]
${(x.refined||x.text).slice(0,80000)}`}], {task:"parse"});
    const nodes = (out.nodes||[]).filter(n=>n.id&&n.label);
    const ids = new Set(nodes.map(n=>n.id));
    nodes.forEach(n=>{ if(n.parent && !ids.has(n.parent)) n.parent=null; });

    if(!nodes.length) throw new Error("맵을 만들지 못했어요. 다시 시도해 주세요.");

  });

function mapTree(map){
  const kids = {}; map.nodes.forEach(n=>{ (kids[n.parent||"_"] ||= []).push(n); });
  const root = (kids["_"]||[])[0];
  return {root, kids};
}
const clip = (s,n) => { s=String(s||""); return s.length>n? s.slice(0,n-1)+"…" : s; };
function nodeBox(n, x, y, w, depth){
  const fill = depth===0? "var(--navy)" : depth===1? "var(--blue-soft)" : "#fff";
  const ink = depth===0? "#fff" : "var(--ink)";
  const on = mapSel===n.id;
  return `<g data-node="${esc(n.id)}" style="cursor:pointer"><rect x="${x}" y="${y-17}" width="${w}" height="34" rx="8" fill="${fill}" stroke="${on?"var(--gold)":depth===0?"var(--navy)":"#a9bbdb"}" stroke-width="${on?3:1.25}"/><text x="${x+w/2}" y="${y+5}" text-anchor="middle" font-size="${depth===0?14:13}" font-weight="${depth<2?700:500}" fill="${ink}">${esc(clip(n.label,16))}</text><title>${esc(n.desc||"")}</title></g>`;
}
function treeSvg(map){
  const {root, kids} = mapTree(map); if(!root) return "";
  const W=190, GX=60, GY=46; let leaf=0; const pos={};
  const place=(n,d)=>{ const ch=kids[n.id]||[]; if(!ch.length){ pos[n.id]={x:24+d*(W+GX), y:30+leaf*GY, d}; leaf++; } else { ch.forEach(c=>place(c,d+1)); const ys=ch.map(c=>pos[c.id].y); pos[n.id]={x:24+d*(W+GX), y:(Math.min(...ys)+Math.max(...ys))/2, d}; } };
  place(root,0);
  const maxD = Math.max(...Object.values(pos).map(p=>p.d));
  const w = 48+(maxD+1)*W+maxD*GX, h = Math.max(80, leaf*GY+20);
  let edges="", boxes="";
  map.nodes.forEach(n=>{ const p=pos[n.id]; if(!p) return; if(n.parent && pos[n.parent]){ const q=pos[n.parent]; const x1=q.x+W, x2=p.x, mx=(x1+x2)/2; edges+=`<path d="M${x1} ${q.y}C${mx} ${q.y} ${mx} ${p.y} ${x2} ${p.y}" fill="none" stroke="#a9b3c6" stroke-width="1.5"/>`; } boxes+=nodeBox(n,p.x,p.y,W,p.d); });
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(map.title)} 가지치기 맵" font-family="Noto Sans KR, sans-serif">${edges}${boxes}</svg>`;
}
function netSvg(map){
  const {root, kids} = mapTree(map); if(!root) return "";
  const lv1 = kids[root.id]||[]; const pos={};
  const R1=180, R2=320, cx=R2+130, cy=R2+50;
  pos[root.id]={x:cx,y:cy,d:0};
  const allLeaves = lv1.reduce((a,n)=>a+Math.max(1,(kids[n.id]||[]).length),0)||1;
  let acc=0;
  lv1.forEach(n=>{ const ch=kids[n.id]||[]; const span=Math.max(1,ch.length)/allLeaves*Math.PI*2; const a=acc+span/2-Math.PI/2; pos[n.id]={x:cx+R1*Math.cos(a), y:cy+R1*Math.sin(a), d:1};
    const place=(list, a0, sp, r, d)=>list.forEach((c,i)=>{ const aa=a0-sp/2+sp*(i+.5)/list.length; pos[c.id]={x:cx+r*Math.cos(aa), y:cy+r*Math.sin(aa), d}; const g=kids[c.id]||[]; if(g.length) place(g, aa, sp/list.length, r+120, d+1); });
    place(ch, a, span*0.9, R2, 2); acc+=span; });
  let edges="", boxes="", extra="";
  const bw = (n,d)=> Math.min(200, Math.max(90, clip(n.label,16).length*13+24));
  map.nodes.forEach(n=>{ const p=pos[n.id]; if(!p) return; if(n.parent&&pos[n.parent]){ const q=pos[n.parent]; edges+=`<line x1="${q.x}" y1="${q.y}" x2="${p.x}" y2="${p.y}" stroke="#a9b3c6" stroke-width="1.5"/>`; } });
  (map.links||[]).forEach(l=>{ const a=pos[l.from], b=pos[l.to]; if(!a||!b) return; extra+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="5 4"/>${l.label?`<text x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2-6}" text-anchor="middle" font-size="11.5" fill="#7a5d14" paint-order="stroke" stroke="#fff" stroke-width="4">${esc(clip(l.label,8))}</text>`:""}`; });
  map.nodes.forEach(n=>{ const p=pos[n.id]; if(!p) return; const w=bw(n,p.d); boxes+=nodeBox(n,p.x-w/2,p.y,w,p.d); });
  const xs=Object.values(pos).map(p=>p.x), ys=Object.values(pos).map(p=>p.y);
  const minX=Math.min(...xs)-120, maxX=Math.max(...xs)+120, minY=Math.min(...ys)-40, maxY=Math.max(...ys)+40;
  return `<svg viewBox="${minX} ${minY} ${maxX-minX} ${maxY-minY}" width="${maxX-minX}" height="${maxY-minY}" role="img" aria-label="${esc(map.title)} 그물망 맵" font-family="Noto Sans KR, sans-serif">${edges}${extra}${boxes}</svg>`;
}

    el.innerHTML=`<span class="sync warn" title="파일로 연 상태에서는 구글 로그인이 안 돼요. 배포한 주소(https://…)에서 열면 로그인·동기화가 돼요.">이 컴퓨터에만 저장</span>`;
  } else if(cloud.mode==="local"){
    el.innerHTML=`<span class="sync warn">이 컴퓨터에만 저장</span><button id="nbIn">로그인</button>`;
    $("#nbIn").onclick=()=>{ try{ sessionStorage.removeItem("jj-local"); }catch(e){} showLogin(); };
  } else el.innerHTML="";
}

/* ───── 로그인 화면 ───── */
function showLogin(msg){
  let ov=$("#loginOv"); if(!ov){ ov=document.createElement("div"); ov.id="loginOv"; document.body.appendChild(ov); }
  ov.className="login-ov";
  ov.innerHTML=`<div class="login-card">
    <div style="display:flex;justify-content:center">${sunSvg(72)}</div>
    <h1>진로진학 합격노트</h1>
    <p class="muted" style="margin:6px 0 20px">합격하는 날까지, 모든 자료를 한 곳에.</p>
    <button class="gbtn" id="gLogin"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.2 0-11.5-4.1-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg> 구글 계정으로 로그인</button>
    ${msg?`<p class="note warn" style="margin:14px 0 0;text-align:left">${msg}</p>`:""}
    <p class="small muted" style="margin:16px 0 0">로그인할 수 있는 계정: ${ALLOWED_EMAILS.map(esc).join(", ")}<br>두 계정 모두 같은 자료가 보여요.</p>
    <button class="lk" id="gLocal" style="margin-top:14px;font-size:13px">로그인 없이 이 컴퓨터에서만 쓰기</button>
  </div>`;
  $("#gLogin").onclick=login;
  $("#gLocal").onclick=()=>{ try{ sessionStorage.setItem("jj-local","1"); }catch(e){} cloud.mode="local"; hideLogin(); renderAcct(); };
}
function hideLogin(){ $("#loginOv")?.remove(); }
async function login(){
  const p = new FB.GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"});
  const b=$("#gLogin"); if(b){ b.disabled=true; b.lastChild.textContent=" 로그인하는 중…"; }
  try{ await FB.signInWithPopup(cloud.auth, p); }
  catch(e){
    if(["auth/popup-blocked","auth/operation-not-supported-in-this-environment","auth/cancelled-popup-request"].includes(e.code)){ try{ await FB.signInWithRedirect(cloud.auth, p); return; }catch(e2){ e=e2; } }
    if(e.code==="auth/popup-closed-by-user"){ showLogin(); return; }
    showLogin(loginError(e));
  }
}
function loginError(e){
  const c=e.code||"";
  if(c==="auth/unauthorized-domain") return `이 주소(${esc(location.hostname)})가 Firebase에 등록되어 있지 않아요. Firebase 콘솔 → Authentication → 설정 → <b>승인된 도메인</b>에 추가해 주세요.`;
  if(c==="auth/operation-not-allowed") return "Firebase 콘솔 → Authentication → 로그인 방법에서 <b>Google</b>을 사용 설정해 주세요.";
  if(c==="auth/network-request-failed") return "인터넷 연결을 확인해 주세요.";
  if(c==="auth/admin-restricted-operation"||/admin_policy|disallowed_useragent|org_internal/i.test(e.message||"")) return "학교(교육청) 계정에서 외부 앱 로그인이 막혀 있을 수 있어요. Gmail 계정으로 로그인해 주세요.";
  return "로그인하지 못했어요: "+esc(e.message||c);
}

/* ───── Firestore 문서로 바꾸기 ───── */
const enc = new TextEncoder();
const bytes = s => enc.encode(s).length;
function clean(v){   // Firestore가 못 담는 값(undefined, 배열 속 배열) 정리
  if(Array.isArray(v)) return v.map(x=>Array.isArray(x)? JSON.stringify(x) : clean(x));
  if(v && typeof v==="object"){ const o={}; for(const [k,x] of Object.entries(v)){ if(x===undefined||k==="") continue; o[k]=clean(x); } return o; }
  return v;
}
function splitText(s, n=180000){ const out=[]; for(let i=0;i<s.length;i+=n) out.push(s.slice(i,i+n)); return out; }
function toDocs(st){
  const docs = {};   // 경로 → 데이터
  docs[""] = {settings:st.settings, sectionsV:st.sectionsV||2};
  const listCol = (name, arr, idOf=x=>x.id) => arr.forEach((x,i)=>{ const id=idOf(x); if(id) docs[`${name}/${id}`] = {...x, _o:i}; });
  listCol("sections", st.sections);
  listCol("notes", st.notes);
  listCol("board", st.board);
  listCol("questions", st.questions);
  listCol("sessions", st.history);
  st.materials.forEach((x,i)=>{
    const d = {...x, _o:i};
    if(bytes(JSON.stringify(d)) > 900000){
      for(const f of ["text","refined"]){
        const parts = splitText(d[f]||""); d[f+"Chunks"] = parts.length; d[f] = "";
        parts.forEach((t,j)=>{ docs[`materials/${x.id}/chunks/${f}-${j}`] = {f, i:j, t}; });
      }
    }
    docs[`materials/${x.id}`] = d;
  });
  st.quant.snapshots.forEach(s=>{ const id=String(s.year||s.date||""); if(id) docs[`quantSnapshots/${id}`]=s; });
  docs["quant/main"] = {criteria:st.quant.criteria, analysis:st.quant.analysis||null};
  docs["studyLog/all"] = {dates:st.studyLog};
  const out={}; for(const [k,v] of Object.entries(docs)) out[k]=clean(JSON.parse(JSON.stringify(v)));
  return out;
}
const docRef = path => FB.doc(cloud.db, path ? `${SPACE}/${path}` : SPACE);

/* ───── 클라우드에서 불러오기 ───── */
async function pullCloud(){
  setSync("☁ 불러오는 중…");
  const root = await FB.getDoc(docRef(""));
  const cols = {};
  for(const c of COLS){ const qs = await FB.getDocs(FB.collection(cloud.db, `${SPACE}/${c}`)); cols[c] = qs.docs.map(d=>({...d.data(), id:d.data().id ?? d.id, _docId:d.id})); }
  if(!root.exists()){
    // 처음 로그인: 이 컴퓨터의 자료를 클라우드에 올려요
    cloud.last = {}; cloud.loaded = true;
    await pushCloud(true);
    toast("이 컴퓨터의 자료를 클라우드에 올렸어요. 이제 어디서든 같은 자료가 보여요.", 4000);
    return;
  }
  const byO = arr => arr.sort((a,b)=>(a._o??0)-(b._o??0)).map(({_o,_docId,...x})=>x);
  const mats = byO(cols.materials);
  for(const m of mats){
    if(m.textChunks || m.refinedChunks){
      const qs = await FB.getDocs(FB.collection(cloud.db, `${SPACE}/materials/${m.id}/chunks`));
      const parts = qs.docs.map(d=>d.data());
      for(const f of ["text","refined"]) if(m[f+"Chunks"]) m[f] = parts.filter(p=>p.f===f).sort((a,b)=>a.i-b.i).map(p=>p.t).join("");
      delete m.textChunks; delete m.refinedChunks;
    }
  }
  const r = root.data();
  const d = {
    settings: r.settings || {}, sectionsV: r.sectionsV || 2,
    sections: byO(cols.sections), materials: mats, notes: byO(cols.notes), board: byO(cols.board),
    questions: byO(cols.questions), history: byO(cols.sessions),
    quant: {criteria:(cols.quant.find(x=>x._docId==="main")||{}).criteria||[], analysis:(cols.quant.find(x=>x._docId==="main")||{}).analysis||null,
            snapshots: cols.quantSnapshots.map(({_docId,id,...x})=>x).sort((a,b)=>(a.year||0)-(b.year||0))},
    studyLog: (cols.studyLog.find(x=>x._docId==="all")||{}).dates || []
  };
  const next = mergeState(d); migrateSections(next);
  const nextLast = Object.fromEntries(Object.entries(toDocs(next)).map(([k,v])=>[k, JSON.stringify(v)]));
  setSync("☁ 동기화됨","ok");
  // 바뀐 게 없으면 화면을 그대로 둬요 (쓰던 글이 끊기지 않게)
  if(cloud.loaded && JSON.stringify(nextLast)===JSON.stringify(cloud.last)) return false;
  const localKey = S?.settings?.apiKey;
  S = next;
  if(!S.settings.apiKey && localKey){ S.settings.apiKey = localKey; }
  cloud.last = nextLast; cloud.loaded = true;
  saveLocal();
  return true;
}

/* ───── 클라우드에 저장하기 (바뀐 문서만) ───── */
function scheduleCloud(){
  if(!cloud.user) return;
  cloud.dirty = true; setSync("☁ 저장 대기…");
  clearTimeout(cloud.timer); cloud.timer = setTimeout(()=>pushCloud(), 1200);
}
async function pushCloud(all){
  if(!cloud.user) return;
  if(cloud.pushing){ cloud.dirty=true; return; }
  cloud.pushing = true; cloud.dirty = false; setSync("☁ 저장 중…");
  try{
    const now = toDocs(S), ops = [];
    const nowJ = Object.fromEntries(Object.entries(now).map(([k,v])=>[k, JSON.stringify(v)]));
    for(const [k,j] of Object.entries(nowJ)) if(all || cloud.last[k]!==j) ops.push(["set",k]);
    for(const k of Object.keys(cloud.last)) if(!(k in nowJ)) ops.push(["del",k]);
    for(let i=0;i<ops.length;i+=400){
      const b = FB.writeBatch(cloud.db);
      for(const [op,k] of ops.slice(i,i+400)){ if(op==="set") b.set(docRef(k), now[k]); else b.delete(docRef(k)); }
      await b.commit();
    }
    cloud.last = nowJ;
    setSync("☁ 동기화됨","ok");
  }catch(e){
    console.error(e);
    setSync("⚠ 저장 실패","err");
    toast(e.code==="permission-denied" ? "클라우드 저장 권한이 없어요. Firestore 규칙을 게시했는지 확인해 주세요." : "클라우드에 저장하지 못했어요. 인터넷이 연결되면 다시 시도해요.", 5000);
    cloud.dirty = true;
  }finally{
    cloud.pushing = false;
    if(cloud.dirty){ clearTimeout(cloud.timer); cloud.timer=setTimeout(()=>pushCloud(), 3000); }
  }
}
async function flushCloud(){ clearTimeout(cloud.timer); if(cloud.user && (cloud.dirty || cloud.pushing)){ while(cloud.pushing) await new Promise(r=>setTimeout(r,200)); await pushCloud(); } }

/* ───── 시작 ───── */
async function initCloud(){
  if(location.protocol==="file:"){ cloud.mode="file"; renderAcct(); return; }
  if(!window.FB){ cloud.mode="local"; renderAcct(); return; }
  const app = FB.initializeApp(FIREBASE_CONFIG);
  cloud.auth = FB.getAuth(app);
  try{ cloud.db = FB.initializeFirestore(app, {localCache: FB.persistentLocalCache({tabManager: FB.persistentMultipleTabManager()})}); }
  catch(e){ cloud.db = FB.initializeFirestore(app, {}); }
  try{ await FB.setPersistence(cloud.auth, FB.browserLocalPersistence); }catch(e){}
  FB.getRedirectResult(cloud.auth).catch(e=>showLogin(loginError(e)));
  let local=false; try{ local = sessionStorage.getItem("jj-local")==="1"; }catch(e){}
  FB.onAuthStateChanged(cloud.auth, async user=>{
    if(!user){ cloud.user=null; cloud.mode = local ? "local" : "login"; renderAcct(); if(!local) showLogin(); return; }
    const email = (user.email||"").toLowerCase();
    if(!ALLOWED_EMAILS.includes(email)){ await FB.signOut(cloud.auth); showLogin(`<b>${esc(email)}</b> 계정은 이 노트에 들어올 수 없어요. 허용된 계정으로 로그인해 주세요.`); return; }
    cloud.user = user; cloud.mode="cloud"; hideLogin(); renderAcct();
    try{ await pullCloud(); }catch(e){ console.error(e); setSync("⚠ 불러오기 실패","err"); toast(e.code==="permission-denied" ? "클라우드 자료를 읽을 권한이 없어요. Firestore 규칙을 게시했는지 확인해 주세요." : "클라우드 자료를 불러오지 못했어요: "+(e.message||e.code), 6000); }
    render(); renderAcct();
  });
  // 다른 기기에서 바꾼 내용: 이 창으로 돌아오면 새로 불러와요
  document.addEventListener("visibilitychange", async ()=>{
    if(document.visibilityState==="visible" && cloud.user && !cloud.dirty && !cloud.pushing && !room.active){
      try{ if(await pullCloud()){ render(); toast("다른 기기에서 바뀐 내용을 불러왔어요."); } }catch(e){}
    } else if(document.visibilityState==="hidden"){ flushCloud(); }
  });
  window.addEventListener("beforeunload", e=>{ if(cloud.dirty||cloud.pushing){ pushCloud(); e.preventDefault(); e.returnValue=""; } });
}

$("#brandSun").innerHTML = sunSvg(38);
$("#brand").onclick = ()=>$("#nbHome").click();
boot();
